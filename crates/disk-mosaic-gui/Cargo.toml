[package]
name = "disk-mosaic-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
disk-mosaic-core = { path = "../disk-mosaic-core" }
egui = "0.34"
egui_extras = { version = "0.34", features = ["svg"] }
eframe = "0.34"
egui_solarized = "0.34"
home = { workspace = true }
humansize = "2.1.3"
log = { workspace = true }
opener = { version = "0.8.4", features = ["reveal"] }
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = "0.28"
strum_macros = "0.28"
sysinfo = "0.39"
treemap = { workspace = true }