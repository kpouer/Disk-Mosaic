[package]
name = "disk-mosaic-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
description = "This is a library used for Terminal User Interface of https://crates.io/crates/Disk-Mosaic"
readme = "README.md"

[dependencies]
disk-mosaic-core = { workspace = true, features = ["gui"] }
egui.workspace = true
egui_extras = { workspace = true, features = ["svg"] }
eframe.workspace = true
egui_solarized = "0.36.0"
home.workspace = true
humansize.workspace = true
log.workspace = true
opener = { version = "0.8.4", features = ["reveal"] }
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = "0.28"
strum_macros = "0.28"
sysinfo = "0.39"
treemap.workspace = true