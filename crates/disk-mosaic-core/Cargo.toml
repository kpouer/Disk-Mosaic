[package]
name = "disk-mosaic-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
description = "This is a library used for Terminal User Interface of https://crates.io/crates/Disk-Mosaic"
readme = "README.md"

[dependencies]
ecolor = { workspace = true, optional = true }
log = { workspace = true }
rayon = "1.12.0"
serde = { workspace = true, features = ["derive"] }
treemap = { workspace = true }
unicode-normalization = "0.1.25"

[dev-dependencies]
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[features]
default = []
gui = ["dep:ecolor"]